name: CI

# Typecheck, unit tests and a Rust `cargo check` on macOS. No signing, no secrets, no sidecar download
# (the sidecar binary is only needed to bundle; a placeholder satisfies tauri-build's externalBin check).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage placeholder sidecar
        # tauri-build verifies that every externalBin exists for the host triple.
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\necho "placeholder sidecar (CI)"\n' > "src-tauri/binaries/opencode-$triple"
          chmod +x "src-tauri/binaries/opencode-$triple"

      - name: Build frontend (tauri-build embeds dist/)
        run: pnpm build

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
